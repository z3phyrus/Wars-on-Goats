[workspace]
members = ["spacetime-module"]
resolver = "2"

[package]
name = "wars_on_goats"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.6", features = ["ws", "json"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.4", features = ["v4"] }
